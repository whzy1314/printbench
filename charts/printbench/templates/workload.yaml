{{- $image := .Values.image }}
{{- if not (kindIs "string" $image) }}
{{- fail "An immutable PrintBench image reference must be a string" }}
{{- end }}
{{- $component := `[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*` }}
{{- $reference := printf `^(%s(:[0-9]+)?/)?%s(/%s)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[a-f0-9]{64}$` $component $component $component }}
{{- if not (regexMatch $reference $image) }}
{{- fail "An immutable PrintBench image reference with a sha256 digest is required" }}
{{- end }}
{{- $pullSecret := .Values.imagePullSecret }}
{{- if and (hasKey .Values "imagePullSecret") (not (kindIs "string" $pullSecret)) }}
{{- fail "The namespace-local pull Secret name must be a string" }}
{{- end }}
{{- if and $pullSecret (or (gt (len $pullSecret) 253) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$` $pullSecret))) }}
{{- fail "The namespace-local pull Secret name must be a valid Kubernetes DNS subdomain" }}
{{- end }}
{{- $ingressHost := .Values.ingressHost }}
{{- $dns := `^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$` }}
{{- if hasKey .Values "ingressHost" }}
{{- if or (not (kindIs "string" $ingressHost)) (gt (len $ingressHost) 253) (not (regexMatch $dns $ingressHost)) }}
{{- fail "ingressHost must be a canonical lowercase DNS hostname without a port or trailing dot" }}
{{- end }}
{{- end }}
{{- $management := .Values.management }}
{{- if hasKey .Values "management" }}
{{- if or (not (kindIs "map" $management)) (ne (len $management) 3) }}
{{- fail "management requires only host, tokenSecret and tlsSecret" }}
{{- end }}
{{- if or (not (kindIs "string" $management.host)) (gt (len $management.host) 253) (not (regexMatch $dns $management.host)) }}
{{- fail "management.host must be a canonical lowercase DNS hostname" }}
{{- end }}
{{- range $name := list $management.tokenSecret $management.tlsSecret }}
{{- if or (not (kindIs "string" $name)) (gt (len $name) 253) (not (regexMatch `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$` $name)) }}
{{- fail "management requires valid tokenSecret and tlsSecret names" }}
{{- end }}
{{- end }}
{{- if eq $management.tokenSecret $management.tlsSecret }}
{{- fail "management tokenSecret and tlsSecret must be separate" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if $pullSecret }}
      imagePullSecrets:
        - name: {{ $pullSecret | quote }}
      {{- end }}
      containers:
        - name: printbench
          image: {{ $image | quote }}
          imagePullPolicy: Always
          {{- if or $ingressHost $management }}
          env:
            {{- if $ingressHost }}
            - name: PRINTBENCH_HOST
              value: {{ $ingressHost | quote }}
            {{- end }}
            {{- if $management }}
            - {name: PRINTBENCH_MANAGEMENT_PORT, value: "8766"}
            - {name: PRINTBENCH_MANAGEMENT_HOST, value: {{ $management.host | quote }}}
            - {name: PRINTBENCH_MANAGEMENT_TOKEN_FILE, value: /run/printbench/token/token}
            - {name: PRINTBENCH_MANAGEMENT_CERT_FILE, value: /run/printbench/tls/tls.crt}
            - {name: PRINTBENCH_MANAGEMENT_KEY_FILE, value: /run/printbench/tls/tls.key}
            - {name: PRINTBENCH_MANAGEMENT_PROXY_CA_FILE, value: /run/printbench/tls/ca.crt}
            {{- end }}
          ports:
            {{- if $ingressHost }}
            - name: http
              containerPort: 8765
            {{- end }}
            {{- if $management }}
            - name: management
              containerPort: 8766
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: library
              mountPath: /data
            {{- if $management }}
            - {name: management-token, mountPath: /run/printbench/token, readOnly: true}
            - {name: management-tls, mountPath: /run/printbench/tls, readOnly: true}
            {{- end }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os, urllib.request as u;
                  os.close(os.open('/data/library', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW));
                  u.urlopen(u.Request('http://127.0.0.1:8765/api/projects', method='HEAD'), timeout=3).close()
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request as u;
                  u.urlopen(u.Request('http://127.0.0.1:8765/', method='HEAD'), timeout=3).close()
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-library
        {{- if $management }}
        - name: management-token
          secret:
            secretName: {{ $management.tokenSecret | quote }}
            defaultMode: 288 # 0440
            items:
              - {key: token, path: token}
        - name: management-tls
          secret:
            secretName: {{ $management.tlsSecret | quote }}
            defaultMode: 288 # 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
        {{- end }}
{{- if $management }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-management" .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name | quote }}
  ports:
    - name: https
      port: 443
      targetPort: management
{{- end }}
{{- if $ingressHost }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name | quote }}
                port:
                  name: http
{{- end }}
