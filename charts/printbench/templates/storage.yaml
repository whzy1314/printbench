{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
{{- end }}
{{- with .Values.storageClass.provisioner }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "storageClass.name is required when creating a StorageClass" $.Values.storageClass.name | quote }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: {{ . | quote }}
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- with $.Values.storageClass.parameters }}
parameters: {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-library
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  {{- with .Values.storageClass.name }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: 5Gi
