name: Publish PrintBench image

on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the PrintBench main branch
        run: |
          if [[ "$GITHUB_REPOSITORY" != whzy1314/printbench || "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publish only from whzy1314/printbench main.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and push the dispatched commit
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          temp=$(mktemp -d "$RUNNER_TEMP/printbench.XXXXXX")
          trap 'rm -rf -- "$temp"' EXIT
          export DOCKER_CONFIG="$temp"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          image=ghcr.io/whzy1314/printbench
          docker buildx build --platform linux/amd64 --file Dockerfile --push --provenance=false \
            --tag "$image:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$temp/metadata.json" .
          digest=$(jq -er '."containerimage.digest" | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' "$temp/metadata.json")
          printf 'Published %s:%s@%s\n' "$image" "$GITHUB_SHA" "$digest"
